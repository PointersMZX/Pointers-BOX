<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pointers-BOX · 资源分享</title>
<style>
  /* ── Pointers-BOX 分享端（v2.5.0 液态玻璃版：客户端同源 CSS 材质，无 WebGL）────
     材质语言与 Pointers-BOX v2.5.0 客户端完全同源（六层模型克制档）：
     玻璃底对角渐变 + 磨砂 blur/saturate/brightness + 双棱线 + 内泛光 + 外投影
     + 流动光泽带（错相）+ 指针光斑（lerp 水感）+ 背景锥形缓转 + 互质周期光斑 + 细噪点。
     零外部依赖；数据同目录 resources.mcx（MCX 加密容器）。
     性能三原则：动画只动 transform；blur 固定挂元素不逐帧变；色相流动=整层旋转。 */
  :root {
    /* v2.6.0 全局液态玻璃：零填充零染色——玻璃只由折射/磨砂/棱线/光泽构成（纯光学） */
    --bg: #0d0817;
    --purple: #7c5cff;
    --gold: #e8b33e;
    --text: #efeaff;
    --muted: #a99fc4;
    --g-hi: transparent;
    --g-lo: transparent;
    --g-border: rgba(255, 255, 255, 0.20);
    --g-rim-top: rgba(255, 255, 255, 0.42);
    --g-rim-bottom: rgba(255, 255, 255, 0.10);
    --g-inner-glow: rgba(255, 255, 255, 0.06);
    --g-shadow: 0 10px 34px rgba(3, 0, 20, 0.38);
    --g-spot: rgba(255, 255, 255, 0.20);
    --sheen-color: rgba(255, 255, 255, 0.16);
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1100px 700px at 18% -10%, rgba(124, 92, 255, 0.45), transparent 62%),
      radial-gradient(900px 620px at 90% 112%, rgba(232, 179, 62, 0.22), transparent 62%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 34px 16px 48px;
    overflow-x: hidden;
  }
  main { width: 100%; max-width: 540px; position: relative; z-index: 1; }

  /* ── 背景流动层（锥形缓转 + 互质光斑 + 噪点；只动 transform）── */
  .bg-conic {
    position: fixed; inset: -35%; z-index: 0; pointer-events: none;
    background: conic-gradient(from 0deg at 50% 50%,
      rgba(124, 58, 237, 0.15), rgba(232, 179, 62, 0.10),
      rgba(6, 182, 212, 0.11), rgba(236, 72, 153, 0.09),
      rgba(124, 58, 237, 0.15));
    filter: blur(70px);
    animation: bgSpin 90s linear infinite;
    will-change: transform;
  }
  @keyframes bgSpin { to { transform: rotate(1turn); } }
  .bg-blob {
    position: fixed; z-index: 0; pointer-events: none;
    border-radius: 9999px;
    filter: blur(64px);
    opacity: 0.42;
    will-change: transform;
  }
  .bg-blob.b1 {
    width: 46vw; height: 46vw; left: -10vw; top: -14vw;
    background: radial-gradient(circle, #7c5cff 0%, transparent 70%);
    animation: bgDrift1 26s ease-in-out infinite alternate;
  }
  .bg-blob.b2 {
    width: 40vw; height: 40vw; right: -10vw; bottom: -12vw;
    background: radial-gradient(circle, #e8b33e 0%, transparent 70%);
    animation: bgDrift2 34s ease-in-out infinite alternate-reverse;
    animation-delay: -9s;
  }
  .bg-blob.b3 {
    width: 30vw; height: 30vw; left: 38vw; bottom: 2vw;
    background: radial-gradient(circle, #c084fc 0%, transparent 70%);
    animation: bgDrift3 19s ease-in-out infinite alternate;
    animation-delay: -5s;
  }
  /* 三条异路径：与 26/34/19s 互质周期配合，光斑永不整体重复 */
  @keyframes bgDrift1 {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(6vw, 4vh) scale(1.12); }
    100% { transform: translate(-4vw, 6vh) scale(0.94); }
  }
  @keyframes bgDrift2 {
    0%   { transform: translate(0, 0) scale(1.15); }
    50%  { transform: translate(-8vw, -5vh) scale(0.9); }
    100% { transform: translate(5vw, -7vh) scale(1.3); }
  }
  @keyframes bgDrift3 {
    0%   { transform: translate(-6vw, -4vh) scale(1); }
    50%  { transform: translate(4vw, 6vh) scale(1.3); }
    100% { transform: translate(10vw, -8vh) scale(0.95); }
  }
  .bg-grain {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    opacity: 0.07; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  /* ── 液态玻璃材质（客户端 .pbox-glass 同源）── */
  .glass {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    background: linear-gradient(135deg, var(--g-hi) 0%, var(--g-lo) 100%);
    /* v2.6.0：折射滤镜由下方 svgGlass 按卡片尺寸注入（Chromium）；回落=纯磨砂 */
    backdrop-filter: var(--glass-refract, none) blur(22px) saturate(165%) brightness(1.10);
    -webkit-backdrop-filter: var(--glass-refract, none) blur(22px) saturate(165%) brightness(1.10);
    border: 1px solid var(--g-border);
    box-shadow:
      inset 0 1px 0 var(--g-rim-top),
      inset 0 -1px 0 var(--g-rim-bottom),
      inset 0 0 28px var(--g-inner-glow),
      var(--g-shadow);
  }
  /* 流动光泽带：斜 105° 白带周期扫过（划完停半拍再循环）；卡片间错相 */
  .glass::before {
    content: "";
    position: absolute; inset: -40% -60%;
    z-index: -1; pointer-events: none;
    background: linear-gradient(105deg, transparent 38%, var(--sheen-color) 50%, transparent 62%);
    transform: translateX(-60%) skewX(-14deg);
    animation: glassSheen 14s ease-in-out infinite;
    animation-delay: var(--sheen-delay, 0s);
    will-change: transform;
  }
  @keyframes glassSheen {
    0%   { transform: translateX(-60%) skewX(-14deg); }
    55%  { transform: translateX(60%) skewX(-14deg); }
    100% { transform: translateX(60%) skewX(-14deg); }
  }
  /* 指针光斑：跟全局 --mx/--my（lerp 水感）在玻璃表面游走，hover 浮现；触屏恒 0 天然关闭 */
  .glass::after {
    content: "";
    position: absolute; inset: 0;
    z-index: -1; pointer-events: none;
    background: radial-gradient(280px circle at calc(50% + var(--mx, 0) * 46%) calc(50% + var(--my, 0) * 46%), var(--g-spot), transparent 62%);
    opacity: 0;
    transition: opacity 0.45s ease;
  }
  .glass:hover::after { opacity: 1; }

  /* 头部（纯文字 Logo 行） */
  .head { text-align: center; margin-bottom: 22px; }
  .head .logo { font-size: 1.32rem; font-weight: 800; letter-spacing: 0.05em; text-shadow: 0 2px 18px rgba(124, 92, 255, 0.45); }
  .head .logo b { color: var(--gold); }
  .head .tag {
    display: inline-block;
    margin-top: 8px;
    font-size: 0.7rem;
    letter-spacing: 0.16em;
    color: var(--muted);
    background: rgba(232, 179, 62, 0.12);
    border: 1px solid rgba(232, 179, 62, 0.3);
    border-radius: 999px;
    padding: 3px 12px;
  }

  /* 主卡片：正常大圆角（绝不做胶囊——v2.4.0「两坨胶囊」的教训） */
  .card {
    border-radius: 14px;
    padding: 26px 24px;
  }

  /* 状态（加载中 / 失效 / 失败） */
  .state { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 22px 0 18px; text-align: center; }
  .state p { margin: 0; color: var(--muted); font-size: 0.92rem; line-height: 1.9; }
  .loader {
    width: 56px; height: 56px;
    border-radius: 9999px;
    background: rgba(124, 92, 255, 0.12);
    border: 1px solid rgba(124, 92, 255, 0.3);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .drop {
    width: 14px; height: 14px;
    background: linear-gradient(118deg, #684dd6, #e8b33e);
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    animation: dropFall 1.1s cubic-bezier(0.5, 0, 0.3, 1) infinite;
    box-shadow: 0 0 12px rgba(124, 92, 255, 0.55);
  }
  @keyframes dropFall {
    0%   { transform: rotate(-45deg) translateY(-8px) scale(1); opacity: 0.9; }
    55%  { transform: rotate(-45deg) translateY(6px) scale(0.82, 1.18); opacity: 1; }
    75%  { transform: rotate(-45deg) translateY(8px) scale(1.16, 0.72); opacity: 0.5; }
    100% { transform: rotate(-45deg) translateY(-8px) scale(1); opacity: 0.9; }
  }

  /* 详情内容 */
  .badge {
    display: inline-block;
    font-size: 0.72rem;
    color: var(--text);
    background: rgba(232, 179, 62, 0.16);
    border: 1px solid rgba(232, 179, 62, 0.42);
    border-radius: 999px;
    padding: 3px 14px;
    margin-bottom: 12px;
    letter-spacing: 0.08em;
  }
  h2 { font-size: 1.22rem; margin: 0 0 6px; line-height: 1.45; font-weight: 800; }
  .meta { color: var(--muted); font-size: 0.78rem; margin: 0 0 14px; letter-spacing: 0.04em; }
  .intro {
    font-size: 0.9rem;
    line-height: 1.9;
    white-space: pre-wrap;
    margin: 0 0 18px;
    color: var(--text);
  }
  .items-title { font-size: 0.85rem; font-weight: 700; margin: 0 0 12px; color: var(--muted); letter-spacing: 0.06em; }

  /* 分享项 = 轻一档玻璃行（与主卡拉开层次；光泽带三档错相） */
  .item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-radius: 14px;
    padding: 12px 16px;
    margin-bottom: 10px;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.10) 0%, rgba(255, 255, 255, 0.035) 100%);
    backdrop-filter: blur(12px) saturate(145%) brightness(1.05);
    -webkit-backdrop-filter: blur(12px) saturate(145%) brightness(1.05);
    border: 1px solid rgba(255, 255, 255, 0.13);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.20),
      inset 0 -1px 0 rgba(255, 255, 255, 0.05),
      0 4px 16px rgba(3, 0, 20, 0.25);
  }
  .item::before { --sheen-color: rgba(255, 255, 255, 0.09); }
  .item:nth-child(2n)::before { animation-delay: -4.6s; }
  .item:nth-child(3n)::before { animation-delay: -9.3s; }
  .item .name {
    font-size: 0.9rem;
    font-weight: 600;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    position: relative; z-index: 1;
  }
  .item .claim { position: relative; z-index: 1; }

  /* 领取 = 紫金渐变胶囊按钮（+顶部内缘发丝，客户端 GlassButton 同款） */
  .claim {
    flex-shrink: 0;
    display: inline-block;
    text-align: center;
    text-decoration: none;
    font-size: 0.84rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(118deg, #684dd6 0%, #7c5cff 55%, #e8b33e 135%);
    border-radius: 999px;
    padding: 9px 24px;
    letter-spacing: 0.1em;
    box-shadow: 0 4px 18px rgba(124, 92, 255, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.22);
    transition: transform 0.14s ease, filter 0.2s ease;
  }
  .claim:hover { filter: brightness(1.1); }
  .claim:active { transform: scale(0.95); }

  footer {
    margin-top: 26px;
    text-align: center;
    color: var(--muted);
    font-size: 0.78rem;
    line-height: 2;
    position: relative; z-index: 1;
  }
  footer a { color: #b79bff; text-decoration: none; }
  footer a:hover { color: var(--gold); text-decoration: underline; }

  /* 系统级"减少动效"：全部动态层静止（光泽带停半程，光斑/锥转消失，指针光斑不淡入） */
  @media (prefers-reduced-motion: reduce) {
    .bg-conic { animation: none; }
    .bg-blob { animation: none; }
    .glass::before { animation: none; transform: translateX(0) skewX(-14deg); }
    .glass::after { transition: none; }
    .drop { animation: none; }
  }
</style>
</head>
<body>

<!-- 背景流动层：锥形色相缓转 + 三光斑互质周期漂移 + 细噪点防色带（纯装饰） -->
<div class="bg-conic" aria-hidden="true"></div>
<div class="bg-blob b1" aria-hidden="true"></div>
<div class="bg-blob b2" aria-hidden="true"></div>
<div class="bg-blob b3" aria-hidden="true"></div>
<div class="bg-grain" aria-hidden="true"></div>

<main>
  <div class="head">
    <div class="logo">Pointers-<b>BOX</b></div>
    <span class="tag">分享端</span>
  </div>

  <div class="card glass">
    <div class="state" id="state">
      <div class="loader" aria-hidden="true"><div class="drop"></div></div>
      <p>正在加载资源信息…</p>
    </div>
    <div id="detail" hidden>
      <span class="badge" id="badge"></span>
      <h2 id="name"></h2>
      <p class="meta" id="meta"></p>
      <p class="intro" id="intro"></p>
      <div class="items-title" id="items-title"></div>
      <div id="items"></div>
    </div>
  </div>

  <footer>

<script>
/* 指针液体跟随（v2.5.0 客户端同源）：rAF 每帧把指针目标值以 lerp 0.08 平滑写入 --mx/--my，
   玻璃光斑随之水感游走；触屏无 hover 恒 0、系统"减少动效"不启动、切后台暂停。 */
(function () {
  'use strict'
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return
  if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return
  var cur = { x: 0, y: 0 }
  var target = { x: 0, y: 0 }
  var raf = 0
  var root = document.documentElement
  window.addEventListener('pointermove', function (e) {
    target.x = (e.clientX / window.innerWidth) * 2 - 1
    target.y = (e.clientY / window.innerHeight) * 2 - 1
  }, { passive: true })
  function loop() {
    cur.x += (target.x - cur.x) * 0.08
    cur.y += (target.y - cur.y) * 0.08
    root.style.setProperty('--mx', cur.x.toFixed(4))
    root.style.setProperty('--my', cur.y.toFixed(4))
    raf = requestAnimationFrame(loop)
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      if (raf) cancelAnimationFrame(raf)
      raf = 0
    } else if (!raf) {
      raf = requestAnimationFrame(loop)
    }
  })
  raf = requestAnimationFrame(loop)
})()
</script>

<script>
(function () {
  'use strict'

  // ════════════════════════════════════════════════════════════════
  // 数据加载（MCX 加密容器解码器，与 Pointers-BOX src/shared/mcx.ts 同算法同密钥）
  // 只走同目录 resources.mcx（v2.4.0 起不再兼容 .json）
  // ════════════════════════════════════════════════════════════════
  var state = document.getElementById('state')
  var detail = document.getElementById('detail')

  function showEmpty(msg) {
    var loader = state.querySelector('.loader')
    if (loader) loader.style.display = 'none'
    var p = state.querySelector('p')
    if (p) p.textContent = msg
    detail.hidden = true
    state.style.display = 'flex'
  }

  var MCX = (function () {
    var KEY_A = [0x5d,0x97,0xfc,0x2e,0xe7,0xfe,0x17,0x40,0xba,0xf2,0x03,0x0c,0x8a,0x60,0x44,0x63,
                 0x54,0xa9,0x9f,0x51,0x11,0xf6,0x8c,0xe7,0x38,0xec,0x9e,0x72,0x2b,0x54,0x3e,0x0d]
    var KEY_B = [0x16,0x25,0x5d,0xa7,0xe1,0x61,0xcf,0x01,0x21,0x1b,0x2b,0xcb,0x71,0x36,0x63,0xec,
                 0x52,0x01,0x34,0x3b,0x9b,0x79,0xac,0x31,0x07,0x69,0xf6,0xb6,0x3e,0xdb,0x18,0x31]
    var MAGIC = [0x4d, 0x43, 0x58]
    var VER = 1
    var SALT = 16
    function keyBytes() { return KEY_A.map(function (b, i) { return b ^ KEY_B[i] }) }
    function fnv1a(bytes) {
      var h = 0x811c9dc5
      for (var i = 0; i < bytes.length; i++) {
        h ^= bytes[i]
        h = Math.imul(h, 0x01000193)
      }
      return h >>> 0
    }
    function keystream(seed, len) {
      var a = seed >>> 0
      var out = []
      for (var i = 0; i < len; i += 4) {
        a = (a + 0x6d2b79f5) | 0
        var t = Math.imul(a ^ (a >>> 15), 1 | a)
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t
        var w = (t ^ (t >>> 14)) >>> 0
        out[i] = (w >>> 24) & 0xff
        if (i + 1 < len) out[i + 1] = (w >>> 16) & 0xff
        if (i + 2 < len) out[i + 2] = (w >>> 8) & 0xff
        if (i + 3 < len) out[i + 3] = w & 0xff
      }
      return out
    }
    function b64(text) {
      var clean = text.replace(/[^A-Za-z0-9+/=]/g, '')
      if (clean.length === 0 || clean.length % 4 !== 0) return null
      try { return atob(clean) } catch (e) { return null }
    }
    return {
      open: function (text) {
        if (typeof text !== 'string') return text
        var bin = b64(text)
        if (!bin || bin.length < MAGIC.length + 1 + SALT + 1) return text
        var bytes = []
        for (var i = 0; i < bin.length; i++) bytes.push(bin.charCodeAt(i))
        for (var m = 0; m < MAGIC.length; m++) if (bytes[m] !== MAGIC[m]) return text
        if (bytes[MAGIC.length] !== VER) return text
        var salt = bytes.slice(MAGIC.length + 1, MAGIC.length + 1 + SALT)
        var ct = bytes.slice(MAGIC.length + 1 + SALT)
        var ks = keystream(fnv1a(keyBytes().concat(salt)), ct.length)
        var pt = new Array(ct.length)
        for (var j = 0; j < ct.length; j++) pt[j] = ct[j] ^ ks[j]
        try { return decodeURIComponent(escape(String.fromCharCode.apply(null, pt))) } catch (e) { return text }
      }
    }
  })()

  var id = new URLSearchParams(location.search).get('id')
  if (!id) {
    showEmpty('分享链接无效，请让朋友重新分享。')
  }

  // 与本页同目录的数据文件（v2.4.0 MCX：只走 resources.mcx 加密容器，不再兼容 .json）
  function loadResources() {
    function open(text) {
      try { return JSON.parse(MCX.open(text)) } catch (e) { throw new Error('bad json') }
    }
    function fetchText(url) {
      return fetch(url, { cache: 'no-cache' })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text() })
    }
    return fetchText('resources.mcx').then(open)
  }

  function renderDetail(res, shares) {
    document.getElementById('badge').textContent = res.category || '资源'
    document.getElementById('name').textContent = res.name
    var meta = []
    if (res.release_date) meta.push('发布：' + res.release_date)
    if (res.last_modified) meta.push('更新：' + res.last_modified)
    document.getElementById('meta').textContent = meta.join('　')
    document.getElementById('intro').textContent = res.introduction || '暂无简介'
    document.getElementById('items-title').textContent = '分享项（' + shares.length + '）'

    var box = document.getElementById('items')
    shares.forEach(function (s) {
      var row = document.createElement('div')
      row.className = 'item glass'
      var name = document.createElement('div')
      name.className = 'name'
      name.textContent = s.name
      name.title = s.name
      var btn = document.createElement('a')
      btn.className = 'claim'
      btn.href = s.url
      btn.target = '_blank'
      btn.rel = 'noopener'
      btn.textContent = '领取'
      row.appendChild(name)
      row.appendChild(btn)
      box.appendChild(row)
    })
  }

  if (id) {
    loadResources()
      .then(function (raw) {
        var list = Array.isArray(raw) ? raw : (raw && Array.isArray(raw.resources) ? raw.resources : [])
        var res = null
        for (var i = 0; i < list.length; i++) {
          if (String(list[i] && list[i].id) === id) { res = list[i]; break }
        }
        if (!res) {
          showEmpty('该资源已失效（可能已被平台下架），请在平台上查看其他资源。')
          return
        }
        var shares = (Array.isArray(res.shares) && res.shares.length > 0)
          ? res.shares
          : (Array.isArray(res.links)
            ? res.links.map(function (u, i) { return { name: '分享项 ' + (i + 1), url: u } })
            : [])
        renderDetail(res, shares)
        state.style.display = 'none'
        detail.hidden = false
      })
      .catch(function () {
        showEmpty('资源信息加载失败，请检查网络后刷新重试。')
      })
  }
})()
</script>
</body>
