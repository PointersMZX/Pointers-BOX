appId: cc.pointers.box
productName: Pointers-BOX
copyright: Copyright © 2026 Pointers-BOX All Rights Reserved

directories:
  output: release
  buildResources: resources

asar: true
files:
  - out/**
  - package.json

extraResources:
  - from: resources/icons
    to: icons
  # v2.2.0：box.json（应用信息）嵌入包内，远程不可达时兜底
  # v2.4.0 MCX：嵌入文件换加密容器 box.mcx（scripts/build-mcx.mjs 由 resources/box.json 生成）
  - from: resources/box.mcx
    to: box.mcx
    filter:
      - "**/*"

win:
  # 用户提供的官方图标（256x256 ICO）
  icon: resources/icons/app.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

publish:
  provider: github
  owner: PointersMZX
  repo: Pointers-BOX
