<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Pointers-BOX</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1a365d;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
        overflow: hidden;
        user-select: none;
      }
      img {
        width: 300px;
        height: 300px;
        object-fit: contain;
        /* 落座式入场：轻微下沉到位，无缩放回弹、无持续呼吸 —— 稳，不果冻 */
        animation: settle 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .name {
        color: #fff;
        margin-top: 18px;
        font-size: 22px;
        letter-spacing: 2px;
        opacity: 0;
        animation: fade 0.5s ease-out 0.2s both;
      }
      .bar {
        width: 180px;
        height: 4px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 2px;
        margin-top: 22px;
        overflow: hidden;
      }
      .bar > div {
        width: 100%;
        height: 100%;
        background: #fff;
        border-radius: 2px;
        transform-origin: left center;
        animation: fill 1.4s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      @keyframes settle {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes fade {
        to {
          opacity: 0.95;
        }
      }
      @keyframes fill {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }
    </style>
  </head>
  <body>
    <img src="../icons/app-icon.png" alt="Pointers-BOX" />
    <div class="name">Pointers-BOX</div>
    <div class="bar"><div></div></div>
  </body>
</html>
