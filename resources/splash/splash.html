<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Pointers-BOX</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1a365d;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
        overflow: hidden;
        user-select: none;
      }
      img {
        width: 300px;
        height: 300px;
        object-fit: contain;
        animation:
          pop 0.9s ease-out both,
          breathe 2.2s ease-in-out 0.9s infinite;
      }
      .name {
        color: #fff;
        margin-top: 18px;
        font-size: 22px;
        letter-spacing: 2px;
        opacity: 0;
        animation: fade 0.8s ease-out 0.5s both;
      }
      .bar {
        width: 180px;
        height: 4px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 2px;
        margin-top: 22px;
        overflow: hidden;
      }
      .bar > div {
        width: 40%;
        height: 100%;
        background: #fff;
        border-radius: 2px;
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.6);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.04);
        }
      }
      @keyframes fade {
        to {
          opacity: 0.95;
        }
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }
    </style>
  </head>
  <body>
    <img src="../icons/app-icon.png" alt="Pointers-BOX" />
    <div class="name">Pointers-BOX</div>
    <div class="bar"><div></div></div>
  </body>
</html>
