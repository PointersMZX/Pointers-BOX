name: Build

# v2.0.0 平台裁剪：仅保留质量门禁（typecheck + test + build），
# Windows 双端由维护者本地构建（scripts/build-win.mjs → release/install/），
# Android 由 android.yml 在 tag 推送时自动构建并挂到 Release。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
