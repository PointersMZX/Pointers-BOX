name: Release

# 上传 Release 需要 contents: write 权限（GitHub 默认令牌只读）
permissions:
  contents: write

on:
  push:
    tags:
      - '**'
  workflow_dispatch:

jobs:
  # Windows 两个版本由维护者本机自行打包上传（pnpm build:win + 自制 NSIS），
  # CI 仅负责本机无法构建的平台：macOS dmg / Linux deb+AppImage。
  desktop:
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build & publish
        run: npx electron-builder --config electron-builder.yml --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
