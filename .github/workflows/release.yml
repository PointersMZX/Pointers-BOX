name: Release

# 上传 Release 需要 contents: write 权限（GitHub 默认令牌只读）
permissions:
  contents: write

env:
  # CI 机器走 GitHub 官方源（.npmrc 的国内镜像仅用于本机，跨洋访问不稳定）
  ELECTRON_MIRROR: https://github.com/electron-userland/electron/releases/download/
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org

on:
  push:
    tags:
      - 'v*' # v2.0.0-beta 这类
      - '2*' # 2.0.0Beta 这类（无 v 前缀）
  workflow_dispatch:

jobs:
  # Windows 两个版本由维护者本机自行打包上传（pnpm build:win + 自制 NSIS）。
  # CI 构建本机无法构建的平台后，用 softprops 把包附加到"触发 tag 所在的 Release"
  # （不用 electron-builder 的 --publish，它的发布目标标签固定为 v+版本号，无法自定义）。
  desktop:
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch_flags: --x64 --arm64 # Intel + 苹果芯片双架构
          - os: ubuntu-latest
            arch_flags: --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log
      - name: Build web bundle
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee webbuild.log
      - name: Build packages
        run: |
          set -o pipefail
          npx electron-builder --config electron-builder.yml --publish never ${{ matrix.arch_flags }} 2>&1 | tee builder.log
      - name: Dump failure logs to ci-logs branch
        if: failure()
        shell: bash
        run: |
          git config user.email "ci@pointers.local"
          git config user.name "ci-bot"
          git fetch origin main --depth 1
          git checkout -B ci-logs origin/main
          mkdir -p logs
          cp -f install.log webbuild.log builder.log logs/ 2>/dev/null || true
          git add -A logs
          git commit -m "ci log dump: ${{ matrix.os }} run ${{ github.run_id }}" || true
          git push origin ci-logs
      - name: Attach packages to release
        if: always() # 即使个别目标失败，也把已构建的产物先挂上
        uses: softprops/action-gh-release@v2
        with:
          name: v2.0.0 Beta
          files: |
            release/*.dmg
            release/*.zip
            release/*.deb
            release/*.AppImage
            release/*.blockmap
            release/latest-mac.yml
            release/latest-linux.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
