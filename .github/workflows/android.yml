name: Android APK

# 上传 Release 需要 contents: write 权限（GitHub 默认令牌只读）
permissions:
  contents: write

on:
  push:
    tags:
      - '**'
  workflow_dispatch:

jobs:
  apk:
    # 仅 tag 触发时执行（防止普通 push 到 main 也跑构建）
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx cap sync android
      # 有密钥则签名，否则出未签名 Release APK（可自行签名后分发）
      - name: Decode keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/pbox.keystore
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Pointers-BOX-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
