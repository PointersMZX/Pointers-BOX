name: Android APK

# 上传 Release 需要 contents: write 权限（GitHub 默认令牌只读）
permissions:
  contents: write

env:
  # CI 机器走 GitHub 官方源（.npmrc 的国内镜像仅用于本机，跨洋访问不稳定）
  ELECTRON_MIRROR: https://github.com/electron-userland/electron/releases/download/
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org

on:
  push:
    tags:
      - '**'
  workflow_dispatch:

jobs:
  apk:
    # 仅 tag 触发时执行（防止普通 push 到 main 也跑构建）
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx cap sync android
      # 密钥已提交（android/app/pbox-release.keystore），产出可直接安装的已签名 APK
      - name: Build signed APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace 2>&1 | tee gradle.log
      - name: 失败时输出日志到摘要页
        if: failure()
        working-directory: android
        run: |
          echo "## ❌ Android 构建失败（gradle.log 末尾 60 行）" >> "$GITHUB_STEP_SUMMARY"
          tail -60 gradle.log >> "$GITHUB_STEP_SUMMARY" || echo "（无日志文件）" >> "$GITHUB_STEP_SUMMARY"
      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          name: v2.0.0 Beta
          files: android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Pointers-BOX-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
